name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git
      - name: Build and test contracts (unit, fuzz, invariant)
        working-directory: contracts
        run: |
          forge build
          if ls test/*.sol >/dev/null 2>&1; then forge test -vvv; else echo "No contract tests yet"; fi

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests (agent, service, dashboard content parity)
        run: npm test
      - name: Build dashboard
        run: npm run build -w apps/dashboard
