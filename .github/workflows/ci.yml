name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git
      - name: Build and test contracts (unit, fuzz, invariant, Base Sepolia fork)
        working-directory: contracts
        env:
          RPC_URL: https://sepolia.base.org   # public endpoint, not a secret
        run: |
          forge build
          forge test -vv

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests (agent, service, dashboard content parity)
        run: npm test
      - name: Build dashboard
        run: npm run build -w apps/dashboard
      - name: Dashboard reputation numbers equal the registry (FR-015)
        run: npx tsx scripts/check-reputation.ts
        env:
          RPC_URL: https://sepolia.base.org   # public endpoint, not a secret
      - name: Dashboard smoke tests (Playwright, desktop + phone)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w apps/dashboard
