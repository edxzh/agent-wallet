name: Agent run

# The scripted agent (US5): every 6 hours it pays the demo API, attempts deliberate violations,
# releases expired authorizations, and commits a fresh dashboard snapshot. Base Sepolia only.
# Uses only the agent key (constitution IV: the operator key never goes to CI).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write # the gas alert (scripts/check-gas.ts)

concurrency: agent-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
      # 004: worker-bot-01's agent key, for its deliveries. An agent key like the one above (constitution IV).
      WORKER_AGENT_PRIVATE_KEY: ${{ secrets.WORKER_AGENT_PRIVATE_KEY }}
      WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
      API_URL: ${{ vars.API_URL || 'https://api.demo.yunshu.ai' }}
      RPC_URL: https://sepolia.base.org
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -z "$AGENT_PRIVATE_KEY" ]; then
            echo "::notice::AGENT_PRIVATE_KEY secret not set yet (tasks.md T049); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.setup.outputs.ready == 'true'
      - name: Gas at start
        if: steps.setup.outputs.ready == 'true'
        run: npx tsx scripts/check-gas.ts --start
        continue-on-error: true
      - name: Run scenario (exit 3 = wallet needs funds; still snapshot)
        if: steps.setup.outputs.ready == 'true'
        id: scenario
        run: npm run cli -w packages/agent -- run-scenario
        continue-on-error: true
      # 004: research-bot-01 hires worker-bot-01 through the escrow (accept / dispute / no-show), and
      # closes earlier runs' due timeouts. Skips itself until the escrow is set up.
      - name: Hire scenario
        if: steps.setup.outputs.ready == 'true' && env.WORKER_AGENT_PRIVATE_KEY != ''
        id: hires
        run: npm run cli -w packages/agent -- run-hires
        continue-on-error: true
      - name: Release expired authorizations
        if: steps.setup.outputs.ready == 'true'
        run: npm run cli -w packages/agent -- release-expired
      # Exit 4 (an ERC-8004 registry changed) stops the run before any payment; the snapshot still
      # runs, so the dashboard shows "registry changed" (pinnedOk: false).
      - name: Snapshot for the dashboard
        if: steps.setup.outputs.ready == 'true'
        run: npm run snapshot
      - name: Dashboard numbers equal the registry (FR-015)
        if: steps.setup.outputs.ready == 'true'
        run: npx tsx scripts/check-reputation.ts
      # Runway per account from this run's own spend; a low account opens (or updates) one issue,
      # so the owner hears about it before a run fails for lack of gas.
      - name: Gas check
        if: steps.setup.outputs.ready == 'true'
        id: gas
        run: npx tsx scripts/check-gas.ts
        continue-on-error: true
      - name: Gas alert issue
        if: steps.setup.outputs.ready == 'true' && steps.gas.outputs.low == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create gas-low --color d93f0b --description "An agent-run account is low on test ETH" 2>/dev/null || true
          open=$(gh issue list --label gas-low --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file gas-alert.md
          else
            gh issue create --title "Gas low on the agent-run accounts" --label gas-low --body-file gas-alert.md
          fi
      - name: Commit snapshot
        if: steps.setup.outputs.ready == 'true'
        run: |
          git config user.name "agent-wallet-bot"
          git config user.email "agent-wallet-bot@users.noreply.github.com"
          git add apps/dashboard/src/data/history.json
          if [ -f apps/dashboard/src/data/jobs.json ]; then git add apps/dashboard/src/data/jobs.json; fi
          git diff --cached --quiet || git commit -m "chore(snapshot): $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase --autostash
          git push
      - name: Fail if the scenario failed
        if: steps.setup.outputs.ready == 'true' && (steps.scenario.outcome == 'failure' || steps.hires.outcome == 'failure')
        run: exit 1
